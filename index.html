<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Projects</title>
<meta name="description" content="A collection of projects, each with its own landing page.">
<style>
/*
  HOW TO ADD A PROJECT
  Copy one <a class="project"> block in the "PROJECTS" list below, paste it
  under the others and change:
    href          the project's landing page (relative to this file)
    the <img>     an icon (optional: delete the <img> to show the initials instead)
    data-initials one or two letters, shown when there is no icon
    data-hue      0–360, the colour of the initials tile (optional)
    <h2>, <p>     its name and a one-line description
    the tags      any number of <span class="tag">, or none
  The page counts the projects and the search box finds them by name,
  description or tag. Nothing else needs changing.
*/
:root {
  --bg: #f4f5fc;
  --bg-2: #eceefa;
  --surface: rgba(255, 255, 255, .72);
  --surface-hover: rgba(255, 255, 255, .95);
  --line: rgba(28, 32, 72, .09);
  --text: #151832;
  --muted: #5f6588;
  --soft: rgba(28, 32, 72, .05);
  --accent: #6c5cf6;
  --accent-2: #2ec5dd;
  --shadow: 0 1px 2px rgba(25, 28, 70, .06), 0 14px 40px rgba(25, 28, 70, .10);
  --shadow-hover: 0 2px 4px rgba(25, 28, 70, .06), 0 24px 60px rgba(60, 50, 160, .18);
  --blob-a: rgba(124, 108, 255, .26);
  --blob-b: rgba(46, 197, 221, .22);
  --blob-c: rgba(255, 128, 171, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e1c;
    --bg-2: #10132a;
    --surface: rgba(26, 30, 56, .62);
    --surface-hover: rgba(34, 39, 72, .85);
    --line: rgba(255, 255, 255, .08);
    --text: #eceefb;
    --muted: #9aa0c4;
    --soft: rgba(255, 255, 255, .05);
    --accent: #8a7cff;
    --accent-2: #3fd0e6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 40px rgba(0, 0, 0, .35);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .3), 0 24px 60px rgba(0, 0, 0, .5);
    --blob-a: rgba(124, 108, 255, .24);
    --blob-b: rgba(46, 197, 221, .14);
    --blob-c: rgba(255, 105, 160, .10);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e1c;
  --bg-2: #10132a;
  --surface: rgba(26, 30, 56, .62);
  --surface-hover: rgba(34, 39, 72, .85);
  --line: rgba(255, 255, 255, .08);
  --text: #eceefb;
  --muted: #9aa0c4;
  --soft: rgba(255, 255, 255, .05);
  --accent: #8a7cff;
  --accent-2: #3fd0e6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 40px rgba(0, 0, 0, .35);
  --shadow-hover: 0 2px 4px rgba(0, 0, 0, .3), 0 24px 60px rgba(0, 0, 0, .5);
  --blob-a: rgba(124, 108, 255, .24);
  --blob-b: rgba(46, 197, 221, .14);
  --blob-c: rgba(255, 105, 160, .10);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Inter", "Noto Sans", sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, var(--bg), var(--bg-2));
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(80px); animation: drift 28s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 50vmax; height: 50vmax; left: -16vmax; top: -20vmax; background: var(--blob-a); }
.aurora i:nth-child(2) { width: 42vmax; height: 42vmax; right: -16vmax; top: 12vmax; background: var(--blob-b); animation-duration: 34s; }
.aurora i:nth-child(3) { width: 36vmax; height: 36vmax; left: 28vmax; bottom: -22vmax; background: var(--blob-c); animation-duration: 40s; }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } .project { transition: none; } }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 64px; }
@media (min-width: 720px) { .wrap { padding: 0 28px 80px; } }

header { padding: 72px 0 34px; text-align: center; }
@media (min-width: 720px) { header { padding: 96px 0 44px; } }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13.5px; font-weight: 600; backdrop-filter: blur(10px); }
.eyebrow b { color: var(--accent); }
h1 { font-size: clamp(36px, 6vw, 60px); line-height: 1.05; letter-spacing: -.035em; margin: 20px 0 12px; }
h1 span { background: linear-gradient(120deg, var(--accent), #5b7cff 45%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { color: var(--muted); font-size: clamp(16px, 2vw, 19px); max-width: 620px; margin: 0 auto; }

.search { position: relative; max-width: 460px; margin: 30px auto 0; }
.search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; color: inherit; padding: 13px 16px 13px 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); outline: none; backdrop-filter: blur(14px); transition: border-color .2s, box-shadow .2s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }

.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); margin-top: 34px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 980px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.project {
  position: relative; display: flex; flex-direction: column; gap: 14px;
  padding: 24px; border-radius: 24px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  transition: transform .2s, box-shadow .2s, background .2s, border-color .2s;
}
.project:hover, .project:focus-visible { transform: translateY(-4px); box-shadow: var(--shadow-hover); background: var(--surface-hover); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); outline: none; }
.project .top { display: flex; align-items: center; gap: 14px; }
.logo { width: 52px; height: 52px; border-radius: 15px; flex: none; display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: 19px; letter-spacing: -.02em; color: #fff; }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo.initials { background: linear-gradient(135deg, hsl(var(--hue, 250) 85% 65%), hsl(calc(var(--hue, 250) + 40) 80% 55%)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }
.project h2 { margin: 0; font-size: 19px; letter-spacing: -.015em; line-height: 1.25; }
.project p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.go { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; font-size: 14.5px; }
.go svg { width: 16px; height: 16px; transition: transform .2s; }
.project:hover .go svg { transform: translateX(4px); }

.empty { text-align: center; color: var(--muted); padding: 40px 0; }
footer { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 56px; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <span class="eyebrow"><b id="count">0</b> <span id="noun">projects</span></span>
    <h1>Projects</h1>
    <p class="lede">Apps and experiments, each with its own page. Pick one to see what it does and how to get it.</p>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="search" type="search" placeholder="Search projects" autocomplete="off" aria-label="Search projects">
    </label>
  </header>

  <main class="grid" id="projects">
    <!-- ======================= PROJECTS ======================= -->

    <a class="project" href="privatecloud.html">
      <div class="top">
        <span class="logo" data-hue="250"></span>
        <h2>Private Cloud</h2>
      </div>
      <p>Turn your devices into a storage server.</p>
    </a>

    <!-- Copy this block for the next project:
    <a class="project" href="https://example.com/your-project/">
      <div class="top">
        <span class="logo" data-initials="YP" data-hue="190"><img src="path/to/icon.svg" alt=""></span>
        <h2>Your Project</h2>
      </div>
      <p>One line about what it does.</p>
      <div class="tags"><span class="tag">Android</span></div>
      <span class="go">View project <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg></span>
    </a>
    -->

    <!-- ===================== END PROJECTS ===================== -->
  </main>
  <p class="empty" id="empty" hidden>No project matches that.</p>

</div>

<script>
"use strict";
const cards = [...document.querySelectorAll(".project")];
document.getElementById("count").textContent = cards.length;
document.getElementById("noun").textContent = cards.length === 1 ? "project" : "projects";

// A missing or broken icon falls back to coloured initials.
for (const logo of document.querySelectorAll(".logo")) {
  const img = logo.querySelector("img");
  const initials = () => {
    logo.replaceChildren(logo.dataset.initials || "•");
    logo.classList.add("initials");
    if (logo.dataset.hue) logo.style.setProperty("--hue", logo.dataset.hue);
  };
  if (!img) initials();
  else {
    img.addEventListener("error", initials);
    if (img.complete && img.naturalWidth === 0) initials();
  }
}

const search = document.getElementById("search"), empty = document.getElementById("empty");
search.closest(".search").hidden = cards.length < 4;
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  for (const card of cards) {
    const hit = !q || card.textContent.toLowerCase().includes(q);
    card.hidden = !hit;
    if (hit) shown++;
  }
  empty.hidden = shown > 0;
});
</script>
</body>
</html>
